name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: waypost
    steps:
      - uses: actions/checkout@v7
        with:
          path: waypost
      - name: Read the schema version
        id: schema
        run: echo "tag=$(cat .waypost-schema-version)" >> "$GITHUB_OUTPUT"
      # The app depends on file:../waypost-schema, so the schema goes next to it, at the pinned tag.
      - uses: actions/checkout@v7
        with:
          repository: tamas-labs/waypost-schema
          ref: ${{ steps.schema.outputs.tag }}
          path: waypost-schema
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: waypost/package-lock.json
      - run: npm ci
      # The app's dependencies only: the dev tools (Jest, ESLint, drizzle-kit) do not reach the phone. The moderate and low
      # findings are all in build and test tooling that expo and expo-router pull in (audit WP-APP-018).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      # The SDK's versions of the native packages and the app config (audit WP-APP-017); it asks the Expo service. Pinned:
      # a broken release (1.21.7 lacked its @expo/env dependency) must not fail the CI; move it up by hand.
      - run: npx --yes expo-doctor@1.21.6
