<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Útvonal szerkesztése</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; padding-top: 52px">
  <div style="display: flex; align-items: center; gap: 12px; padding: 0 16px 12px">
    <a href="S-Telephely.dc.html" aria-label="Vissza" style="width: 48px; height: 48px; border-radius: 50%; background: {{t.surface}}; border: 1px solid {{t.cardBorder}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
      <span style="font-size: 20px; font-weight: 800">Éjszakai kör</span>
      <span style="font-size: 13px; font-weight: 600; color: {{t.text2}}">v4 szerkesztése · szabad sorrend</span>
    </div>
  </div>

  <div style="display: flex; gap: 10px; align-items: flex-start; margin: 0 16px; padding: 12px 16px; border-radius: 18px; background: {{t.runBg}}; font-size: 14px; line-height: 1.45">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.run}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></svg>
    <span>Mentéskor új verzió (v5) készül. A futó kör a régivel fejeződik be, a korábbi jelentések nem változnak.</span>
  </div>

  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 0">
    <sc-for list="{{pts}}" as="p" hint-placeholder-count="7">
      <div style="display: flex; align-items: center; gap: 6px; min-height: 60px; padding: 0 6px 0 4px; border-radius: 18px; background: {{p.bg}}; border: 1px solid {{p.border}}">
        <button aria-label="Áthelyezés: {{p.name}}" style="width: 44px; height: 52px; border: none; background: transparent; color: {{t.pending}}; display: flex; align-items: center; justify-content: center; flex: none">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>
        </button>
        <span style="width: 28px; height: 28px; border-radius: 50%; background: {{t.runBg}}; color: {{t.run}}; display: flex; align-items: center; justify-content: center; flex: none; font-size: 13px; font-weight: 800">{{p.n}}</span>
        <span style="display: flex; flex-direction: column; flex: 1; min-width: 0; padding-left: 6px">
          <span style="font-size: 16px; font-weight: 800; color: {{p.color}}">{{p.name}}</span>
          <span style="font-size: 12px; font-weight: 600; color: {{t.text2}}">{{p.meta}}</span>
        </span>
        <button aria-label="Szerkesztés: {{p.name}}" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: transparent; color: {{t.text2}}; display: flex; align-items: center; justify-content: center; flex: none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>
        </button>
        <button aria-label="Kivétel az útvonalból: {{p.name}}" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: transparent; color: {{t.miss}}; display: flex; align-items: center; justify-content: center; flex: none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>
        </button>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 30px; border-top: 1px solid {{t.line}}">
    <a href="S-Betanitas.dc.html" style="height: 58px; border-radius: 999px; border: 2px dashed {{t.dash}}; color: {{t.accent}}; text-decoration: none; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Új pont felvétele
      <span style="font-size: 12px; font-weight: 700; color: {{t.text2}}">· bejárást igényel</span>
    </a>
    <button style="height: 68px; border-radius: 999px; border: none; background: {{t.accent}}; color: {{t.onAccent}}; font-family: inherit; font-size: 19px; font-weight: 800">Mentés v5-ként</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sötét","világos"],"default":"sötét"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const D={bg:'#0F1420',surface:'#182033',card:'#141B2B',field:'#0F1420',cardBorder:'transparent',line:'#2C3650',track:'#2C3650',dash:'#2C3650',text:'#E8ECF5',text2:'#9AA6BF',accent:'#8AB4FF',onAccent:'#0B1630',ok:'#6EE7A8',okBg:'#1E3A2E',run:'#8AB4FF',runBg:'#1D2B4A',warn:'#FFB38A',warnBg:'#3A2418',miss:'#FF8A8A',missBg:'#3D1C22',manual:'#C9B8FF',manualBg:'#2E2747',time:'#F5D06B',timeBg:'#3A3216',offBg:'#2A2414',offFg:'#FFCF7A',pending:'#5A6788'};
    const L={bg:'#EEF2F8',surface:'#FFFFFF',card:'#FFFFFF',field:'#EEF2F8',cardBorder:'#DCE3EE',line:'#DCE3EE',track:'#DCE3EE',dash:'#BAC6D8',text:'#0F1726',text2:'#4F5B73',accent:'#2F6BDB',onAccent:'#FFFFFF',ok:'#157F4A',okBg:'#D7F2E3',run:'#2F6BDB',runBg:'#DCE7FB',warn:'#B4470F',warnBg:'#FDE6D8',miss:'#C0262D',missBg:'#FBE0E1',manual:'#6B46C1',manualBg:'#ECE5FB',time:'#8A6100',timeBg:'#FBF0C9',offBg:'#FDF0D5',offFg:'#8A5300',pending:'#8592AD'};
    const t = (this.props.theme ?? 'sötét') === 'világos' ? L : D;
    const row = (n, name, meta, dragging) => ({ n, name, meta, bg: dragging ? t.runBg : t.card, border: dragging ? t.accent : t.cardBorder, color: t.text });
    return {
      t,
      pts: [
        row(1, 'Főbejárat', 'NFC · fotó'),
        row(2, 'Portaépület hátsó ajtó', 'NFC · utasítás'),
        row(3, 'Raktár 1 – rakodókapu', 'QR · fotó'),
        row(4, 'Raktár 2 – vészkijárat', 'NFC · utasítás · áthelyezés alatt', true),
        row(5, 'Kazánház', 'NFC'),
        row(6, 'Tetőfeljáró', 'NFC · utasítás'),
        row(7, 'Parkoló – sorompó', 'QR'),
        row(8, 'Kerítés, ÉK sarok', 'QR · kültéri')
      ]
    };
  }
}
</script>
</body>
</html>
