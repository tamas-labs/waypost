<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Műszakzárás</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; padding: 52px 16px 30px; gap: 14px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="B-Kezdolap.dc.html" aria-label="Vissza" style="width: 48px; height: 48px; border-radius: 50%; background: {{t.surface}}; border: 1px solid {{t.cardBorder}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <div style="display: flex; flex-direction: column; flex: 1">
      <span style="font-size: 22px; font-weight: 800">Műszakzárás</span>
      <span style="font-size: 13px; font-weight: 600; color: {{t.text2}}">Nagy Péter · 20:00 – 07:58</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 18px; background: {{t.surface}}; border: 1px solid {{t.cardBorder}}">
      <span style="width: 28px; height: 28px; border-radius: 50%; background: {{t.okBg}}; color: {{t.ok}}; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5l5 5L19.5 7"/></svg></span>
      <span style="font-size: 30px; font-weight: 800; line-height: 1">11</span>
      <span style="font-size: 13px; font-weight: 700; color: {{t.text2}}">teljesítve</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 18px; background: {{t.surface}}; border: 1px solid {{t.cardBorder}}">
      <span style="width: 28px; height: 28px; border-radius: 50%; background: {{t.warnBg}}; color: {{t.warn}}; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v9M12 19v.01"/></svg></span>
      <span style="font-size: 30px; font-weight: 800; line-height: 1">1</span>
      <span style="font-size: 13px; font-weight: 700; color: {{t.text2}}">hiányos</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 18px; background: {{t.surface}}; border: 1px solid {{t.cardBorder}}">
      <span style="width: 28px; height: 28px; border-radius: 50%; background: {{t.missBg}}; color: {{t.miss}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
      <span style="font-size: 30px; font-weight: 800; line-height: 1">1</span>
      <span style="font-size: 13px; font-weight: 700; color: {{t.text2}}">elmaradt</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 24px; background: {{t.surface}}; border: 1px solid {{t.cardBorder}}">
    <div style="display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 3px" role="img" aria-label="13 kör: 11 teljesítve, 21:00 hiányos, 03:00 elmaradt">
      <sc-for list="{{rounds}}" as="r" hint-placeholder-count="13">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 5px">
          <span style="width: 100%; height: 28px; border-radius: 8px; background: {{r.bg}}"></span>
          <span style="font-size: 10px; font-weight: 700; color: {{t.text2}}">{{r.h}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; border-radius: 24px; background: {{t.surface}}; border: 1px solid {{t.cardBorder}}; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0 16px; border-bottom: 1px solid {{t.line}}">
      <span style="width: 30px; height: 30px; border-radius: 50%; background: {{t.warnBg}}; color: {{t.warn}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4h11l-2 4 2 4H5"/></svg></span>
      <span style="font-size: 16px; font-weight: 700; flex: 1">Események</span>
      <span style="font-size: 17px; font-weight: 800">2</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0 16px; border-bottom: 1px solid {{t.line}}">
      <span style="width: 30px; height: 30px; border-radius: 50%; background: {{t.manualBg}}; color: {{t.manual}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></span>
      <span style="font-size: 16px; font-weight: 700; flex: 1">Nem igazolt pont</span>
      <span style="font-size: 17px; font-weight: 800">1</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0 16px">
      <span style="width: 30px; height: 30px; border-radius: 50%; background: {{t.timeBg}}; color: {{t.time}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></span>
      <span style="font-size: 16px; font-weight: 700; flex: 1">Időgyanús leolvasás</span>
      <span style="font-size: 17px; font-weight: 800">1</span>
    </div>
  </div>

  <div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border-radius: 18px; background: {{t.offBg}}; color: {{t.text}}; font-size: 14px; line-height: 1.45">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.offFg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M7 18a4.5 4.5 0 01-.6-8.96A6 6 0 0118 9.5a4 4 0 01-.5 8"/><path d="M12 12v8M9 15l3-3 3 3"/></svg>
    <span><b>3 tétel vár feltöltésre.</b> A jelentés a feltöltés után megy ki a supervisornak, akkor is, ha már zártál.</span>
  </div>

  <button style="margin-top: auto; height: 68px; border-radius: 999px; border: none; background: {{t.accent}}; color: {{t.onAccent}}; font-family: inherit; font-size: 20px; font-weight: 800">Zárás PIN-kóddal</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sötét","világos"],"default":"sötét"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const D={bg:'#0F1420',surface:'#182033',card:'#141B2B',field:'#0F1420',cardBorder:'transparent',line:'#2C3650',track:'#2C3650',dash:'#2C3650',text:'#E8ECF5',text2:'#9AA6BF',accent:'#8AB4FF',onAccent:'#0B1630',ok:'#6EE7A8',okBg:'#1E3A2E',run:'#8AB4FF',runBg:'#1D2B4A',warn:'#FFB38A',warnBg:'#3A2418',miss:'#FF8A8A',missBg:'#3D1C22',manual:'#C9B8FF',manualBg:'#2E2747',time:'#F5D06B',timeBg:'#3A3216',offBg:'#2A2414',offFg:'#FFCF7A',pending:'#5A6788'};
    const L={bg:'#EEF2F8',surface:'#FFFFFF',card:'#FFFFFF',field:'#EEF2F8',cardBorder:'#DCE3EE',line:'#DCE3EE',track:'#DCE3EE',dash:'#BAC6D8',text:'#0F1726',text2:'#4F5B73',accent:'#2F6BDB',onAccent:'#FFFFFF',ok:'#157F4A',okBg:'#D7F2E3',run:'#2F6BDB',runBg:'#DCE7FB',warn:'#B4470F',warnBg:'#FDE6D8',miss:'#C0262D',missBg:'#FBE0E1',manual:'#6B46C1',manualBg:'#ECE5FB',time:'#8A6100',timeBg:'#FBF0C9',offBg:'#FDF0D5',offFg:'#8A5300',pending:'#8592AD'};
    const t = (this.props.theme ?? 'sötét') === 'világos' ? L : D;
    const hours = ['20','21','22','23','00','01','02','03','04','05','06','07','08'];
    return { t, rounds: hours.map((h, i) => ({ h, bg: i === 1 ? t.warn : i === 7 ? t.miss : t.ok })) };
  }
}
</script>
</body>
</html>
