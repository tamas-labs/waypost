      <circle cx="150" cy="122" r="13" fill="{{t.surface}}" stroke="{{t.pending}}" stroke-width="2.5" stroke-dasharray="4 3"/>

      <text x="356" y="38.5" text-anchor="middle" font-size="12" font-weight="800" fill="{{t.text2}}">8</text>
      <circle cx="56" cy="66" r="13" fill="{{t.surface}}" stroke="{{t.pending}}" stroke-width="2.5" stroke-dasharray="4 3"/>
      <text x="56" y="70.5" text-anchor="middle" font-size="12" font-weight="800" fill="{{t.text2}}">9</text>

      <span style="width: 18px; height: 4px; border-radius: 2px; background: {{t.accent}}"></span>
      Megtett út · 22:03–22:11
    </div>
    <button aria-label="Saját helyzet középre" style="position: absolute; right: 12px; bottom: 12px; width: 52px; height: 52px; border-radius: 50%; border: 1px solid {{t.cardBorder}}; background: {{t.surface}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center">

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sötét","világos"],"default":"sötét"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

    const dark = {bg:'#0F1420',surface:'#182033',cardBorder:'transparent',track:'#2C3650',text:'#E8ECF5',text2:'#9AA6BF',accent:'#8AB4FF',onAccent:'#0B1630',ok:'#6EE7A8',manual:'#C9B8FF',offBg:'#2A2414',offFg:'#FFCF7A',event:'#FFB38A',pending:'#5A6788',

      mapBg:'#E6ECF4',mapRoad:'#FFFFFF',mapBuild:'#D2DBE8',mapLabel:'#4F5B73',fence:'#9AA6BF',markText:'#FFFFFF',me:'#0F1726',meHalo:'rgba(47,107,219,0.22)'};
    return { t: (this.props.theme ?? 'sötét') === 'világos' ? light : dark };
  }
}
</script>
