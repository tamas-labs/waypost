<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Menetrend</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; padding: 52px 16px 30px; gap: 12px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="S-Telephely.dc.html" aria-label="Vissza" style="width: 48px; height: 48px; border-radius: 50%; background: {{t.surface}}; border: 1px solid {{t.cardBorder}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <div style="display: flex; flex-direction: column; flex: 1">
      <span style="font-size: 20px; font-weight: 800">Menetrend</span>
      <span style="font-size: 13px; font-weight: 600; color: {{t.text2}}">Éjszakai kör</span>
    </div>
  </div>

  <span style="font-size: 14px; font-weight: 800; color: {{t.text2}}; padding: 6px 4px 0">Napok</span>
  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
      <button aria-pressed="{{d.on}}" style="height: 48px; border-radius: 999px; border: 1px solid {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; font-family: inherit; font-size: 14px; font-weight: 800">{{d.l}}</button>
    </sc-for>
  </div>

  <span style="font-size: 14px; font-weight: 800; color: {{t.text2}}; padding: 6px 4px 0">Indítási időpontok</span>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: {{t.surface}}; border: 1px solid {{t.cardBorder}}" role="radiogroup" aria-label="Megadás módja">
    <button role="radio" aria-checked="false" style="height: 40px; border-radius: 999px; border: none; background: transparent; color: {{t.text2}}; font-family: inherit; font-size: 15px; font-weight: 700">Lista</button>
    <button role="radio" aria-checked="true" style="height: 40px; border-radius: 999px; border: none; background: {{t.accent}}; color: {{t.onAccent}}; font-family: inherit; font-size: 15px; font-weight: 800">Ismétlődés</button>
  </div>
  <div style="display: flex; flex-direction: column; border-radius: 24px; background: {{t.surface}}; border: 1px solid {{t.cardBorder}}; overflow: hidden">
    <sc-for list="{{rep}}" as="r" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; justify-content: space-between; min-height: 58px; padding: 0 16px; border-bottom: 1px solid {{t.line}}">
        <span style="font-size: 16px; font-weight: 700">{{r.l}}</span>
        <button style="height: 40px; padding: 0 16px; border-radius: 999px; border: none; background: {{t.field}}; color: {{t.text}}; font-family: inherit; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums">{{r.v}}</button>
      </div>
    </sc-for>
    <div style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; font-size: 14px; font-weight: 700; color: {{t.run}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5l5 5L19.5 7"/></svg>
      13 kör éjszakánként · utolsó 08:00-kor
    </div>
  </div>

  <span style="font-size: 14px; font-weight: 800; color: {{t.text2}}; padding: 6px 4px 0">Időkeret</span>
  <div style="display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 24px; background: {{t.surface}}; border: 1px solid {{t.cardBorder}}">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <button aria-label="5 perccel kevesebb" style="width: 56px; height: 56px; border-radius: 50%; border: none; background: {{t.field}}; color: {{t.text}}; font-family: inherit; font-size: 28px; font-weight: 700">−</button>
      <span style="display: flex; flex-direction: column; align-items: center">
        <span style="font-size: 40px; font-weight: 800; line-height: 1">25 perc</span>
        <span style="font-size: 13px; font-weight: 700; color: {{t.ok}}">javasolt érték</span>
      </span>
      <button aria-label="5 perccel több" style="width: 56px; height: 56px; border-radius: 50%; border: none; background: {{t.field}}; color: {{t.text}}; font-family: inherit; font-size: 28px; font-weight: 700">+</button>
    </div>
    <span style="font-size: 14px; line-height: 1.45; color: {{t.text2}}; text-align: center">Mért bejárás 16:20 × 1,5 = 24:30 → 5 percre kerekítve.</span>
    <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid {{t.line}}">
      <span style="font-size: 16px; font-weight: 700">Nincs időkorlát</span>
      <button role="switch" aria-checked="false" aria-label="Nincs időkorlát" style="width: 56px; height: 34px; border-radius: 999px; border: none; background: {{t.track}}; padding: 3px; display: flex; justify-content: flex-start">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF"></span>
      </button>
    </div>
  </div>

  <button style="margin-top: auto; height: 68px; border-radius: 999px; border: none; background: {{t.accent}}; color: {{t.onAccent}}; font-family: inherit; font-size: 19px; font-weight: 800">Menetrend mentése</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sötét","világos"],"default":"sötét"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const D={bg:'#0F1420',surface:'#182033',card:'#141B2B',field:'#0F1420',cardBorder:'transparent',line:'#2C3650',track:'#2C3650',dash:'#2C3650',text:'#E8ECF5',text2:'#9AA6BF',accent:'#8AB4FF',onAccent:'#0B1630',ok:'#6EE7A8',okBg:'#1E3A2E',run:'#8AB4FF',runBg:'#1D2B4A',warn:'#FFB38A',warnBg:'#3A2418',miss:'#FF8A8A',missBg:'#3D1C22',manual:'#C9B8FF',manualBg:'#2E2747',time:'#F5D06B',timeBg:'#3A3216',offBg:'#2A2414',offFg:'#FFCF7A',pending:'#5A6788'};
    const L={bg:'#EEF2F8',surface:'#FFFFFF',card:'#FFFFFF',field:'#EEF2F8',cardBorder:'#DCE3EE',line:'#DCE3EE',track:'#DCE3EE',dash:'#BAC6D8',text:'#0F1726',text2:'#4F5B73',accent:'#2F6BDB',onAccent:'#FFFFFF',ok:'#157F4A',okBg:'#D7F2E3',run:'#2F6BDB',runBg:'#DCE7FB',warn:'#B4470F',warnBg:'#FDE6D8',miss:'#C0262D',missBg:'#FBE0E1',manual:'#6B46C1',manualBg:'#ECE5FB',time:'#8A6100',timeBg:'#FBF0C9',offBg:'#FDF0D5',offFg:'#8A5300',pending:'#8592AD'};
    const t = (this.props.theme ?? 'sötét') === 'világos' ? L : D;
    const days = ['H','K','Sze','Cs','P','Szo','V'].map((l, i) => {
      const on = i < 5;
      return { l, on: on ? 'true' : 'false', bg: on ? t.accent : t.surface, fg: on ? t.onAccent : t.text2, border: on ? t.accent : t.cardBorder };
    });
    return { t, days, rep: [{ l: 'Első kör', v: '20:00' }, { l: 'Utolsó kör', v: '08:00' }, { l: 'Gyakoriság', v: '60 perc' }] };
  }
}
</script>
</body>
</html>
