<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>B – Kör folyamatban, lista</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; padding-top: 52px">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 20px 14px; gap: 12px">
    <span style="font-size: 20px; font-weight: 800">22:00-s kör</span>
    <div style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 999px; background: {{t.offBg}}; font-size: 13px; font-weight: 700; color: {{t.offFg}}">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4.5 4.5 0 01-.6-8.96A6 6 0 0118 9.5a4 4 0 01-.5 8"/><path d="M4 4l16 16"/></svg>
      Offline · 2 vár
    </div>
  </div>

  <div style="margin: 0 16px; padding: 16px 20px; border-radius: 24px; background: {{t.surface}}; border: 1px solid {{t.cardBorder}}; display: flex; align-items: center; gap: 18px">
    <div style="position: relative; width: 96px; height: 96px; flex: none">
      <svg width="96" height="96" viewBox="0 0 104 104" role="img" aria-label="5 pont kész a 9-ből">
        <circle cx="52" cy="52" r="44" fill="none" stroke="{{t.track}}" stroke-width="10"/>
        <circle cx="52" cy="52" r="44" fill="none" stroke="{{t.accent}}" stroke-width="10" stroke-linecap="round" stroke-dasharray="154 277" transform="rotate(-90 52 52)"/>
      </svg>
      <div style="position: absolute; left: 0; top: 0; width: 96px; height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center">
        <span style="font-size: 26px; font-weight: 800; line-height: 1">5/9</span>
        <span style="font-size: 12px; font-weight: 600; color: {{t.text2}}">pont</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 14px; font-weight: 600; color: {{t.text2}}">Hátralévő idő</span>
      <span style="font-size: 44px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em">14:32</span>
      <span style="font-size: 14px; color: {{t.text2}}">Határidő 22:28</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; margin: 12px 16px 0; padding: 4px; border-radius: 999px; background: {{t.surface}}; border: 1px solid {{t.cardBorder}}">
    <span style="height: 40px; border-radius: 999px; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800">Lista</span>
    <a href="B-Terkep.dc.html" style="height: 40px; border-radius: 999px; color: {{t.text2}}; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">Térkép</a>
  </div>

  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 0">
    <sc-for list="{{done}}" as="p" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 0 16px; border-radius: 18px; background: {{t.card}}; border: 1px solid {{t.cardBorder}}">
        <sc-if value="{{p.manual}}" hint-placeholder-val="{{ false }}">
          <span style="width: 32px; height: 32px; border-radius: 50%; background: {{t.manualBg}}; color: {{t.manual}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></span>
        </sc-if>
        <sc-if value="{{p.verified}}" hint-placeholder-val="{{ true }}">
          <span style="width: 32px; height: 32px; border-radius: 50%; background: {{t.okBg}}; color: {{t.ok}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5l5 5L19.5 7"/></svg></span>
        </sc-if>
        <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
          <span style="font-size: 16px; font-weight: 700">{{p.name}}</span>
          <span style="font-size: 13px; font-weight: 600; color: {{p.metaColor}}">{{p.meta}}</span>
        </div>
      </div>
    </sc-for>
    <sc-for list="{{pending}}" as="p" hint-placeholder-count="2">
      <div style="display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 0 16px; border-radius: 18px; border: 2px dashed {{t.dash}}">
        <span style="width: 32px; height: 32px; border-radius: 50%; box-sizing: border-box; border: 2.5px solid {{t.pending}}; flex: none"></span>
        <span style="font-size: 16px; font-weight: 700; flex: 1">{{p}}</span>
        <span style="font-size: 13px; font-weight: 600; color: {{t.text2}}">Hátravan</span>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; gap: 12px; align-items: center; padding: 14px 16px 30px">
    <button aria-label="Esemény rögzítése" style="width: 72px; height: 72px; border-radius: 50%; border: 1px solid {{t.cardBorder}}; background: {{t.surface}}; color: {{t.event}}; display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>
    </button>
    <button style="flex: 1; height: 72px; border-radius: 999px; border: none; background: {{t.accent}}; color: {{t.onAccent}}; font-family: inherit; font-size: 21px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8.5a5 5 0 010 7"/><path d="M11 6a9 9 0 010 12"/><path d="M15 3.5a13 13 0 010 17"/></svg>
      Leolvasás
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sötét","világos"],"default":"sötét"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = {bg:'#0F1420',surface:'#182033',card:'#141B2B',cardBorder:'transparent',dash:'#2C3650',track:'#2C3650',text:'#E8ECF5',text2:'#9AA6BF',accent:'#8AB4FF',onAccent:'#0B1630',ok:'#6EE7A8',okBg:'#1E3A2E',manual:'#C9B8FF',manualBg:'#2E2747',offBg:'#2A2414',offFg:'#FFCF7A',event:'#FFB38A',pending:'#4A5675'};
    const light = {bg:'#EEF2F8',surface:'#FFFFFF',card:'#FFFFFF',cardBorder:'#DCE3EE',dash:'#BAC6D8',track:'#DCE3EE',text:'#0F1726',text2:'#4F5B73',accent:'#2F6BDB',onAccent:'#FFFFFF',ok:'#157F4A',okBg:'#D7F2E3',manual:'#6B46C1',manualBg:'#ECE5FB',offBg:'#FDF0D5',offFg:'#8A5300',event:'#C2410C',pending:'#9AA6BF'};
    const t = (this.props.theme ?? 'sötét') === 'világos' ? light : dark;
    const row = (name, meta, manual) => ({ name, meta, manual, verified: !manual, metaColor: manual ? t.manual : t.text2 });
    return {
      t,
      done: [
        row('Főbejárat', '22:03 · NFC', false),
        row('Portaépület hátsó ajtó', '22:05 · NFC', false),
        row('Raktár 1 – rakodókapu', '22:07 · QR', false),
        row('Kazánház', '22:09 · Kézi – nem igazolt', true),
        row('Raktár 2 – vészkijárat', '22:11 · NFC', false)
      ],
      pending: ['Tetőfeljáró', 'Parkoló – sorompó', 'Kerítés, ÉK sarok', 'Hulladékudvar']
    };
  }
}
</script>
</body>
</html>
