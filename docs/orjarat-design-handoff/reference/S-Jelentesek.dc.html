<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Jelentésbeállítások</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; padding: 52px 16px 30px; gap: 12px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="S-Telephely.dc.html" aria-label="Vissza" style="width: 48px; height: 48px; border-radius: 50%; background: {{t.surface}}; border: 1px solid {{t.cardBorder}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <div style="display: flex; flex-direction: column; flex: 1">
      <span style="font-size: 20px; font-weight: 800">Jelentések</span>
      <span style="font-size: 13px; font-weight: 600; color: {{t.text2}}">Címzett: kovacs.anna@pelda.hu</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; border-radius: 24px; background: {{t.surface}}; border: 1px solid {{t.cardBorder}}; overflow: hidden">
    <sc-for list="{{reports}}" as="r" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 0 16px; border-bottom: 1px solid {{t.line}}">
        <span style="display: flex; flex-direction: column; flex: 1; min-width: 0">
          <span style="font-size: 16px; font-weight: 800">{{r.title}}</span>
          <span style="font-size: 13px; font-weight: 600; color: {{t.text2}}; line-height: 1.4">{{r.sub}}</span>
        </span>
        <button role="switch" aria-checked="{{r.checked}}" aria-label="{{r.title}}" style="width: 56px; height: 34px; border-radius: 999px; border: none; background: {{r.track}}; padding: 3px; display: flex; justify-content: {{r.justify}}; flex: none">
          <span style="width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF"></span>
        </button>
      </div>
    </sc-for>
  </div>

  <span style="font-size: 14px; font-weight: 800; color: {{t.text2}}; padding: 6px 4px 0">Figyelmeztetés</span>
  <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 24px; background: {{t.surface}}; border: 1px solid {{t.cardBorder}}">
    <span style="font-size: 16px; font-weight: 800">Ha nem jön adat a telephelyről</span>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
      <span style="font-size: 14px; font-weight: 600; color: {{t.text2}}">a menetrend vége után</span>
      <button style="height: 44px; padding: 0 16px; border-radius: 999px; border: none; background: {{t.field}}; color: {{t.text}}; font-family: inherit; font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 6px">
        2 óra
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
  </div>

  <div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border-radius: 18px; background: {{t.runBg}}; font-size: 14px; line-height: 1.45">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.run}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></svg>
    <span>Nyers adatok megőrzése: <b>31 nap</b>. Havi jelentésnél 2 hónapra nő. A heti és havi PDF a fotókat bélyegképként tartalmazza.</span>
  </div>

  <button style="margin-top: auto; height: 68px; border-radius: 999px; border: none; background: {{t.accent}}; color: {{t.onAccent}}; font-family: inherit; font-size: 19px; font-weight: 800">Mentés</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sötét","világos"],"default":"sötét"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const D={bg:'#0F1420',surface:'#182033',card:'#141B2B',field:'#0F1420',cardBorder:'transparent',line:'#2C3650',track:'#2C3650',dash:'#2C3650',text:'#E8ECF5',text2:'#9AA6BF',accent:'#8AB4FF',onAccent:'#0B1630',ok:'#6EE7A8',okBg:'#1E3A2E',run:'#8AB4FF',runBg:'#1D2B4A',warn:'#FFB38A',warnBg:'#3A2418',miss:'#FF8A8A',missBg:'#3D1C22',manual:'#C9B8FF',manualBg:'#2E2747',time:'#F5D06B',timeBg:'#3A3216',offBg:'#2A2414',offFg:'#FFCF7A',pending:'#5A6788'};
    const L={bg:'#EEF2F8',surface:'#FFFFFF',card:'#FFFFFF',field:'#EEF2F8',cardBorder:'#DCE3EE',line:'#DCE3EE',track:'#C7D1E0',dash:'#BAC6D8',text:'#0F1726',text2:'#4F5B73',accent:'#2F6BDB',onAccent:'#FFFFFF',ok:'#157F4A',okBg:'#D7F2E3',run:'#2F6BDB',runBg:'#DCE7FB',warn:'#B4470F',warnBg:'#FDE6D8',miss:'#C0262D',missBg:'#FBE0E1',manual:'#6B46C1',manualBg:'#ECE5FB',time:'#8A6100',timeBg:'#FBF0C9',offBg:'#FDF0D5',offFg:'#8A5300',pending:'#8592AD'};
    const t = (this.props.theme ?? 'sötét') === 'világos' ? L : D;
    const sw = (title, sub, on) => ({ title, sub, checked: on ? 'true' : 'false', track: on ? t.accent : t.track, justify: on ? 'flex-end' : 'flex-start' });
    return {
      t,
      reports: [
        sw('Műszakjelentés', 'Zárás és szinkron után · HTML e-mail', true),
        sw('Napi összesítő', 'Minden reggel 08:30 · HTML e-mail', false),
        sw('Heti összesítő', 'Hétfő reggel · PDF melléklet', true),
        sw('Havi összesítő', 'Hónap 1. napja · PDF, archiválható', false)
      ]
    };
  }
}
</script>
</body>
</html>
