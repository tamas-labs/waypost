<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Műszakkezdés</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; padding: 52px 16px 30px; gap: 14px">
  <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 0 4px">
    <a href="B-PIN.dc.html" aria-label="Vissza" style="width: 48px; height: 48px; border-radius: 50%; background: {{t.surface}}; border: 1px solid {{t.cardBorder}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <div style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 999px; background: {{t.surface}}; border: 1px solid {{t.cardBorder}}; font-size: 13px; font-weight: 600; color: {{t.text2}}">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: {{t.ok}}"></span>
      Szinkronizálva
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px; padding: 6px 4px 4px">
    <span style="font-size: 30px; font-weight: 800; letter-spacing: -0.01em">Szia, Nagy Péter!</span>
    <span style="font-size: 16px; color: {{t.text2}}">Ma éjjel te vagy szolgálatban.</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 18px 20px; border-radius: 24px; background: {{t.surface}}; border: 1px solid {{t.cardBorder}}">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 14px; font-weight: 600; color: {{t.text2}}">Műszak</span>
      <span style="font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums">20:00 – 08:00</span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 14px; font-weight: 600; color: {{t.text2}}">Útvonal</span>
      <span style="font-size: 16px; font-weight: 700">Éjszakai kör · 9 pont</span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 14px; font-weight: 600; color: {{t.text2}}">Körök</span>
      <span style="font-size: 16px; font-weight: 700">13 · óránként · 25 perc</span>
    </div>
  </div>

  <div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border-radius: 18px; background: {{t.runBg}}; color: {{t.text}}; font-size: 14px; line-height: 1.45">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.run}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>
    <span>Kiss Gábor műszakját lezártuk (átadás 19:56). Ez a jelentésben is látszik.</span>
  </div>

  <span style="font-size: 14px; font-weight: 700; color: {{t.text2}}; padding: 6px 4px 0">Készenlét</span>
  <div style="display: flex; flex-direction: column; border-radius: 24px; background: {{t.surface}}; border: 1px solid {{t.cardBorder}}; overflow: hidden">
    <sc-for list="{{checks}}" as="c" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 0 16px; border-bottom: 1px solid {{t.line}}">
        <span style="width: 30px; height: 30px; border-radius: 50%; background: {{t.okBg}}; color: {{t.ok}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5l5 5L19.5 7"/></svg></span>
        <span style="font-size: 16px; font-weight: 700; flex: 1">{{c}}</span>
      </div>
    </sc-for>
    <div style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 12px 0 16px">
      <span style="width: 30px; height: 30px; border-radius: 50%; background: {{t.warnBg}}; color: {{t.warn}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 6v8M12 18v.01"/></svg></span>
      <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
        <span style="font-size: 16px; font-weight: 700">Akkumulátorkímélés</span>
        <span style="font-size: 13px; font-weight: 600; color: {{t.warn}}">Késhet az ébresztés</span>
      </div>
      <button style="height: 44px; padding: 0 16px; border-radius: 999px; border: none; background: {{t.warnBg}}; color: {{t.warn}}; font-family: inherit; font-size: 14px; font-weight: 800">Javítás</button>
    </div>
  </div>

  <a href="B-Kezdolap.dc.html" style="margin-top: auto; height: 68px; border-radius: 999px; background: {{t.accent}}; color: {{t.onAccent}}; text-decoration: none; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center">Műszak indítása</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sötét","világos"],"default":"sötét"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const D={bg:'#0F1420',surface:'#182033',card:'#141B2B',field:'#0F1420',cardBorder:'transparent',line:'#2C3650',track:'#2C3650',dash:'#2C3650',text:'#E8ECF5',text2:'#9AA6BF',accent:'#8AB4FF',onAccent:'#0B1630',ok:'#6EE7A8',okBg:'#1E3A2E',run:'#8AB4FF',runBg:'#1D2B4A',warn:'#FFB38A',warnBg:'#3A2418',miss:'#FF8A8A',missBg:'#3D1C22',manual:'#C9B8FF',manualBg:'#2E2747',time:'#F5D06B',timeBg:'#3A3216',offBg:'#2A2414',offFg:'#FFCF7A',pending:'#5A6788'};
    const L={bg:'#EEF2F8',surface:'#FFFFFF',card:'#FFFFFF',field:'#EEF2F8',cardBorder:'#DCE3EE',line:'#DCE3EE',track:'#DCE3EE',dash:'#BAC6D8',text:'#0F1726',text2:'#4F5B73',accent:'#2F6BDB',onAccent:'#FFFFFF',ok:'#157F4A',okBg:'#D7F2E3',run:'#2F6BDB',runBg:'#DCE7FB',warn:'#B4470F',warnBg:'#FDE6D8',miss:'#C0262D',missBg:'#FBE0E1',manual:'#6B46C1',manualBg:'#ECE5FB',time:'#8A6100',timeBg:'#FBF0C9',offBg:'#FDF0D5',offFg:'#8A5300',pending:'#8592AD'};
    return { t: (this.props.theme ?? 'sötét') === 'világos' ? L : D, checks: ['NFC bekapcsolva', 'Ébresztés engedélyezve', 'Helymeghatározás'] };
  }
}
</script>
</body>
</html>
