<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Sikeres leolvasás</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 52px 20px 30px; gap: 18px">
  <div style="display: flex; justify-content: space-between; align-items: center; width: 100%">
    <span style="font-size: 16px; font-weight: 800">22:00-s kör</span>
    <div style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 999px; background: {{t.offBg}}; font-size: 13px; font-weight: 700; color: {{t.offFg}}">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4.5 4.5 0 01-.6-8.96A6 6 0 0118 9.5a4 4 0 01-.5 8"/><path d="M4 4l16 16"/></svg>
      Offline · 3 vár
    </div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; width: 100%">
    <div style="width: 196px; height: 196px; border-radius: 50%; background: {{t.okBg}}; display: flex; align-items: center; justify-content: center">
      <div style="width: 132px; height: 132px; border-radius: 50%; background: {{t.ok}}; color: {{t.bg}}; display: flex; align-items: center; justify-content: center">
        <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5l5 5L19.5 7"/></svg>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
      <span style="font-size: 16px; font-weight: 700; color: {{t.ok}}">Leolvasva · 22:14 · NFC</span>
      <span style="font-size: 34px; font-weight: 800; line-height: 1.12; letter-spacing: -0.01em">Tetőfeljáró</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; width: 100%; padding: 16px 18px; box-sizing: border-box; border-radius: 24px; background: {{t.surface}}; border: 1px solid {{t.cardBorder}}">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 20px; font-weight: 800">6 / 9 pont</span>
        <span style="font-size: 15px; font-weight: 600; color: {{t.text2}}">még 3 · 12:10 van hátra</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px" aria-hidden="true">
        <sc-for list="{{bar}}" as="b" hint-placeholder-count="9"><span style="height: 8px; border-radius: 4px; background: {{b}}"></span></sc-for>
      </div>
    </div>
    <div style="display: flex; gap: 10px; align-items: flex-start; width: 100%; box-sizing: border-box; padding: 14px 16px; border-radius: 18px; border: 2px dashed {{t.dash}}; font-size: 15px; line-height: 1.45">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></svg>
      <span><b>Utasítás:</b> ellenőrizd, hogy a tetőajtó zárva van-e.</span>
    </div>
  </div>

  <a href="B-Kor.dc.html" style="width: 100%; height: 72px; border-radius: 999px; background: {{t.accent}}; color: {{t.onAccent}}; text-decoration: none; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center">Tovább · 3</a>
  <a href="B-Esemeny.dc.html" style="width: 100%; height: 54px; border-radius: 999px; background: {{t.surface}}; border: 1px solid {{t.cardBorder}}; color: {{t.text}}; text-decoration: none; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.warn}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>
    Esemény ennél a pontnál
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sötét","világos"],"default":"sötét"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const D={bg:'#0F1420',surface:'#182033',card:'#141B2B',field:'#0F1420',cardBorder:'transparent',line:'#2C3650',track:'#2C3650',dash:'#2C3650',text:'#E8ECF5',text2:'#9AA6BF',accent:'#8AB4FF',onAccent:'#0B1630',ok:'#6EE7A8',okBg:'#1E3A2E',run:'#8AB4FF',runBg:'#1D2B4A',warn:'#FFB38A',warnBg:'#3A2418',miss:'#FF8A8A',missBg:'#3D1C22',manual:'#C9B8FF',manualBg:'#2E2747',time:'#F5D06B',timeBg:'#3A3216',offBg:'#2A2414',offFg:'#FFCF7A',pending:'#5A6788'};
    const L={bg:'#EEF2F8',surface:'#FFFFFF',card:'#FFFFFF',field:'#EEF2F8',cardBorder:'#DCE3EE',line:'#DCE3EE',track:'#DCE3EE',dash:'#BAC6D8',text:'#0F1726',text2:'#4F5B73',accent:'#2F6BDB',onAccent:'#FFFFFF',ok:'#157F4A',okBg:'#D7F2E3',run:'#2F6BDB',runBg:'#DCE7FB',warn:'#B4470F',warnBg:'#FDE6D8',miss:'#C0262D',missBg:'#FBE0E1',manual:'#6B46C1',manualBg:'#ECE5FB',time:'#8A6100',timeBg:'#FBF0C9',offBg:'#FDF0D5',offFg:'#8A5300',pending:'#8592AD'};
    const t = (this.props.theme ?? 'sötét') === 'világos' ? L : D;
    return { t, bar: [t.ok, t.ok, t.ok, t.manual, t.ok, t.ok, t.track, t.track, t.track] };
  }
}
</script>
</body>
</html>
