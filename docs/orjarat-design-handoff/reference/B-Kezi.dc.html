<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Kézi rögzítés</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; padding: 52px 16px 30px; gap: 14px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="B-Ismeretlen.dc.html" aria-label="Vissza" style="width: 48px; height: 48px; border-radius: 50%; background: {{t.surface}}; border: 1px solid {{t.cardBorder}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <span style="font-size: 22px; font-weight: 800; flex: 1">Kézi rögzítés</span>
    <span style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; background: {{t.manualBg}}; color: {{t.manual}}; font-size: 13px; font-weight: 800">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>
      Nem igazolt
    </span>
  </div>

  <button style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 16px; border-radius: 18px; border: 1px solid {{t.cardBorder}}; background: {{t.surface}}; color: {{t.text}}; font-family: inherit; text-align: left">
    <span style="display: flex; flex-direction: column; flex: 1">
      <span style="font-size: 13px; font-weight: 700; color: {{t.text2}}">Pont</span>
      <span style="font-size: 17px; font-weight: 800">Kazánház</span>
    </span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.text2}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px" role="radiogroup" aria-label="Ok">
    <button role="radio" aria-checked="false" style="height: 52px; border-radius: 999px; border: 1px solid {{t.cardBorder}}; background: {{t.surface}}; color: {{t.text}}; font-family: inherit; font-size: 15px; font-weight: 700">Címke hiányzik</button>
    <button role="radio" aria-checked="true" style="height: 52px; border-radius: 999px; border: 2px solid {{t.accent}}; background: {{t.runBg}}; color: {{t.text}}; font-family: inherit; font-size: 15px; font-weight: 800">Sérült, nem olvas</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 14px; font-weight: 800; padding-left: 4px">Fotó <span style="color: {{t.miss}}">· kötelező</span></span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div role="img" aria-label="Fotó helye: a sérült címke" style="height: 104px; border-radius: 18px; background: {{t.field}}; border: 1px solid {{t.line}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: {{t.text2}}; font-size: 12px; font-weight: 700; position: relative">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>
        [Fotó 1]
        <span style="position: absolute; right: 6px; top: 6px; width: 22px; height: 22px; border-radius: 50%; background: {{t.ok}}; color: {{t.bg}}; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5l5 5L19.5 7"/></svg></span>
      </div>
      <button aria-label="Fotó készítése" style="height: 104px; border-radius: 18px; border: 2px dashed {{t.dash}}; background: transparent; color: {{t.accent}}; font-family: inherit; font-size: 13px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        Fotó
      </button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="kezi-megj" style="font-size: 14px; font-weight: 800; padding-left: 4px">Megjegyzés <span style="color: {{t.miss}}">· kötelező</span></label>
    <textarea id="kezi-megj" rows="3" style="box-sizing: border-box; padding: 14px 16px; border-radius: 18px; border: 2px solid {{t.accent}}; background: {{t.surface}}; color: {{t.text}}; font-family: inherit; font-size: 16px; font-weight: 600; line-height: 1.45; resize: none">A címke le van törve az ajtókeretről, a darabja a földön.</textarea>
    <div style="display: flex; gap: 8px">
      <button aria-label="Diktálás" style="height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid {{t.cardBorder}}; background: {{t.surface}}; color: {{t.text}}; font-family: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
        Diktálás
      </button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 16px; border-radius: 18px; background: {{t.manualBg}}; font-size: 14px; line-height: 1.45">
    <span style="display: flex; align-items: center; gap: 8px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.manual}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0119 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>GPS rögzítve · ±8 m · 22:16</span>
    <span style="color: {{t.text}}">Nem igazolt pontként kerül a jelentésbe, és „sérült címke” esemény is lesz belőle.</span>
  </div>

  <button style="margin-top: auto; height: 68px; border-radius: 999px; border: none; background: {{t.accent}}; color: {{t.onAccent}}; font-family: inherit; font-size: 20px; font-weight: 800">Rögzítés</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sötét","világos"],"default":"sötét"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const D={bg:'#0F1420',surface:'#182033',card:'#141B2B',field:'#0F1420',cardBorder:'transparent',line:'#2C3650',track:'#2C3650',dash:'#2C3650',text:'#E8ECF5',text2:'#9AA6BF',accent:'#8AB4FF',onAccent:'#0B1630',ok:'#6EE7A8',okBg:'#1E3A2E',run:'#8AB4FF',runBg:'#1D2B4A',warn:'#FFB38A',warnBg:'#3A2418',miss:'#FF8A8A',missBg:'#3D1C22',manual:'#C9B8FF',manualBg:'#2E2747',time:'#F5D06B',timeBg:'#3A3216',offBg:'#2A2414',offFg:'#FFCF7A',pending:'#5A6788'};
    const L={bg:'#EEF2F8',surface:'#FFFFFF',card:'#FFFFFF',field:'#EEF2F8',cardBorder:'#DCE3EE',line:'#DCE3EE',track:'#DCE3EE',dash:'#BAC6D8',text:'#0F1726',text2:'#4F5B73',accent:'#2F6BDB',onAccent:'#FFFFFF',ok:'#157F4A',okBg:'#D7F2E3',run:'#2F6BDB',runBg:'#DCE7FB',warn:'#B4470F',warnBg:'#FDE6D8',miss:'#C0262D',missBg:'#FBE0E1',manual:'#6B46C1',manualBg:'#ECE5FB',time:'#8A6100',timeBg:'#FBF0C9',offBg:'#FDF0D5',offFg:'#8A5300',pending:'#8592AD'};
    return { t: (this.props.theme ?? 'sötét') === 'világos' ? L : D };
  }
}
</script>
</body>
</html>
